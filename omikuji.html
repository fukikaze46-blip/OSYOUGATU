const getRandomItem = (array) => array[Math.floor(Math.random() * array.length)];

const generateOmikuji = (rank) => {
  const data = OMIKUJI_DATABASE[rank];
  return {
    result: data.result,
    color: data.color,
    comment: data.comment,
    fortune: getRandomItem(data.fortunes),
    categories: {
      願望: getRandomItem(data.categories.願望),
      待人: getRandomItem(data.categories.待人),
      失物: getRandomItem(data.categories.失物),
      勝負: getRandomItem(data.categories.勝負),
    }
  };
};

function HorseOmikujiGame() {
  const [scene, setScene] = useState('start');
  const [playerName, setPlayerName] = useState('');
  const [finishedHorses, setFinishedHorses] = useState([]);
  const [playerRank, setPlayerRank] = useState(0);
  const [omikujiData, setOmikujiData] = useState(null);
  const [showDetail, setShowDetail] = useState(false);
  const canvasRef = useRef(null);
  const animationRef = useRef(null);
  const gameStateRef = useRef({ horses: [], finished: [], cameraX: 0 });

  const CANVAS_WIDTH = 640;
  const CANVAS_HEIGHT = 480;
  const TRACK_TOP = 80;
  const LANE_HEIGHT = 52;
  const COURSE_LENGTH = 1600;
  const START_X = 100;
  const GOAL_X = COURSE_LENGTH - 150;
  const CAMERA_OFFSET = 450;
  const CRIMSON = '#B80028';
  const GOLD = '#F9CA00';

  const drawHorse = useCallback((ctx, x, y, colors, frame, name, isPlayer, cameraX) => {
    const screenX = x - cameraX;
    if (screenX < -100 || screenX > CANVAS_WIDTH + 100) return;
    
    const p = 4;
    const legFrame = Math.floor(frame / 3) % 4;
    const legPatterns = [
      { fl: 0, fr: 2, bl: 2, br: 0 },
      { fl: 1, fr: 0, bl: 0, br: 1 },
      { fl: 2, fr: 0, bl: 0, br: 2 },
      { fl: 0, fr: 1, bl: 1, br: 0 },
    ];
    const leg = legPatterns[legFrame];

    ctx.fillStyle = colors.body;
    for (let i = 0; i < 10; i++) {
      for (let j = 0; j < 6; j++) {
        ctx.fillRect(screenX + i * p, y + j * p, p, p);
      }
    }
    for (let i = 0; i < 4; i++) {
      for (let j = 0; j < 5; j++) {
        ctx.fillRect(screenX + (9 + i) * p, y + (j - 3) * p, p, p);
      }
    }
    for (let i = 0; i < 5; i++) {
      for (let j = 0; j < 4; j++) {
        ctx.fillRect(screenX + (12 + i) * p, y + (j - 5) * p, p, p);
      }
    }
    ctx.fillRect(screenX + 17 * p, y - 3 * p, p, p * 2);
    
    ctx.fillStyle = colors.mane;
    for (let i = 0; i < 5; i++) {
      ctx.fillRect(screenX + (9 + i) * p, y - 4 * p, p, p);
      if (i < 3) ctx.fillRect(screenX + (10 + i) * p, y - 5 * p, p, p);
    }
    
    const tailWave = Math.sin(frame * 0.3) * 2;
    for (let i = 0; i < 4; i++) {
      ctx.fillRect(screenX - p + tailWave, y + (i + 2) * p, p, p);
    }
    ctx.fillRect(screenX - 2 * p + tailWave, y + 5 * p, p, p);
    
    ctx.fillStyle = colors.body;
    ctx.fillRect(screenX + 1 * p, y + 6 * p, p, (4 + leg.bl) * p);
    ctx.fillRect(screenX + 3 * p, y + 6 * p, p, (4 + leg.br) * p);
    ctx.fillRect(screenX + 7 * p, y + 6 * p, p, (4 + leg.fl) * p);
    ctx.fillRect(screenX + 9 * p, y + 6 * p, p, (4 + leg.fr) * p);
    
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(screenX + 1 * p, y + (9 + leg.bl) * p, p, p);
    ctx.fillRect(screenX + 3 * p, y + (9 + leg.br) * p, p, p);
    ctx.fillRect(screenX + 7 * p, y + (9 + leg.fl) * p, p, p);
    ctx.fillRect(screenX + 9 * p, y + (9 + leg.fr) * p, p, p);
    
    ctx.fillStyle = '#000000';
    ctx.fillRect(screenX + 15 * p, y - 4 * p, p, p);
    
    ctx.fillStyle = colors.body;
    ctx.fillRect(screenX + 13 * p, y - 6 * p, p, p);
    ctx.fillRect(screenX + 14 * p, y - 7 * p, p, p);
    
    ctx.fillStyle = colors.jockey;
    for (let i = 0; i < 3; i++) {
      for (let j = 0; j < 3; j++) {
        ctx.fillRect(screenX + (5 + i) * p, y + (j - 2) * p, p, p);
      }
    }
    ctx.fillStyle = '#FFD9B3';
    ctx.fillRect(screenX + 6 * p, y - 4 * p, p * 2, p * 2);
    ctx.fillStyle = colors.jockey;
    ctx.fillRect(screenX + 6 * p, y - 5 * p, p * 2, p);
    
    ctx.fillStyle = isPlayer ? GOLD : '#FFFFFF';
    ctx.font = "bold 14px 'DotGothic16', monospace";
    ctx.textAlign = 'center';
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 3;
    ctx.strokeText(name, screenX + 32, y - 32);
    ctx.fillText(name, screenX + 32, y - 32);
    
    if (isPlayer) {
      ctx.fillStyle = GOLD;
      ctx.font = "bold 16px monospace";
      ctx.fillText('▼', screenX + 32, y - 42);
    }
  }, [CANVAS_WIDTH, GOLD]);

  const drawBackground = useCallback((ctx, cameraX) => {
    ctx.fillStyle = CRIMSON;
    ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
    
    ctx.fillStyle = GOLD;
    ctx.fillRect(0, 0, CANVAS_WIDTH, 12);
    
    const fenceOffset = cameraX % 40;
    for (let i = -1; i < CANVAS_WIDTH / 40 + 2; i++) {
      const fenceX = i * 40 - fenceOffset;
      ctx.fillStyle = GOLD;
      ctx.fillRect(fenceX, 0, 8, TRACK_TOP - 10);
      ctx.fillStyle = '#C9A000';
      ctx.fillRect(fenceX + 6, 0, 2, TRACK_TOP - 10);
    }
    
    ctx.fillStyle = GOLD;
    ctx.fillRect(0, 20, CANVAS_WIDTH, 6);
    ctx.fillRect(0, 40, CANVAS_WIDTH, 6);
    ctx.fillRect(0, TRACK_TOP - 16, CANVAS_WIDTH, 8);
    
    ctx.fillStyle = '#1E8E3E';
    ctx.fillRect(0, TRACK_TOP, CANVAS_WIDTH, LANE_HEIGHT * 7 + 20);
    
    ctx.fillStyle = '#177332';
    for (let i = 0; i < 150; i++) {
      const baseX = (i * 47) % 800;
      const gx = (baseX - (cameraX % 800) + 800) % 800;
      const gy = TRACK_TOP + (i * 23) % (LANE_HEIGHT * 7);
      ctx.fillRect(gx, gy, 3, 3);
    }
    
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
    ctx.lineWidth = 2;
    ctx.setLineDash([8, 8]);
    const dashOffset = cameraX % 16;
    ctx.lineDashOffset = -dashOffset;
    for (let i = 1; i < 7; i++) {
      const lineY = TRACK_TOP + i * LANE_HEIGHT;
      ctx.beginPath();
      ctx.moveTo(0, lineY);
      ctx.lineTo(CANVAS_WIDTH, lineY);
      ctx.stroke();
    }
    ctx.setLineDash([]);
    ctx.lineDashOffset = 0;
    
    for (let dist = 0; dist <= COURSE_LENGTH; dist += 100) {
      const markerX = START_X + dist - cameraX;
      if (markerX > -50 && markerX < CANVAS_WIDTH + 50) {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
        ctx.fillRect(markerX, TRACK_TOP, 2, LANE_HEIGHT * 7);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
        ctx.font = "10px 'DotGothic16', monospace";
        ctx.textAlign = 'center';
        ctx.fillText(`${dist}m`, markerX, TRACK_TOP - 5);
      }
    }
    
    const startScreenX = START_X - cameraX;
    if (startScreenX > -20 && startScreenX < CANVAS_WIDTH + 20) {
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(startScreenX, TRACK_TOP, 6, LANE_HEIGHT * 7);
      ctx.fillStyle = GOLD;
      ctx.font = "bold 14px 'DotGothic16', monospace";
      ctx.textAlign = 'center';
      ctx.fillText('START', startScreenX, TRACK_TOP - 8);
    }
    
    const goalScreenX = GOAL_X - cameraX;
    if (goalScreenX > -50 && goalScreenX < CANVAS_WIDTH + 50) {
      const checkerSize = 8;
      for (let row = 0; row < Math.ceil(LANE_HEIGHT * 7 / checkerSize); row++) {
        for (let col = 0; col < 4; col++) {
          ctx.fillStyle = (row + col) % 2 === 0 ? '#FFFFFF' : '#000000';
          ctx.fillRect(goalScreenX + col * checkerSize, TRACK_TOP + row * checkerSize, checkerSize, checkerSize);
        }
      }
      ctx.fillStyle = GOLD;
      ctx.font = "bold 16px 'DotGothic16', monospace";
      ctx.textAlign = 'center';
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 3;
      ctx.strokeText('GOAL', goalScreenX + 16, TRACK_TOP - 8);
      ctx.fillText('GOAL', goalScreenX + 16, TRACK_TOP - 8);
    }
    
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, CANVAS_HEIGHT - 70, CANVAS_WIDTH, 70);
    ctx.strokeStyle = GOLD;
    ctx.lineWidth = 3;
    ctx.strokeRect(2, CANVAS_HEIGHT - 68, CANVAS_WIDTH - 4, 66);
  }, [CANVAS_WIDTH, CANVAS_HEIGHT, TRACK_TOP, LANE_HEIGHT, CRIMSON, GOLD, START_X, GOAL_X, COURSE_LENGTH]);

  const initRace = useCallback(() => {
    const initialHorses = [];
    const name = playerName.trim() || 'プレイヤー';
    
    for (let i = 0; i < 7; i++) {
      initialHorses.push({
        id: i,
        name: i === 0 ? name : CPU_NAMES[i - 1],
        x: START_X,
        lane: i,
        speed: 0,
        baseSpeed: 2.8 + Math.random() * 0.8,
        colors: HORSE_COLORS[i],
        isPlayer: i === 0,
        frame: 0,
        finished: false,
        boostTimer: 0,
        slowTimer: 0,
      });
    }
    
    const lanes = [0, 1, 2, 3, 4, 5, 6];
    for (let i = lanes.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [lanes[i], lanes[j]] = [lanes[j], lanes[i]];
    }
    initialHorses.forEach((horse, idx) => {
      horse.lane = lanes[idx];
    });
    
    gameStateRef.current = { horses: initialHorses, finished: [], cameraX: 0 };
    setFinishedHorses([]);
  }, [playerName, START_X]);

  const gameLoop = useCallback(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    
    const state = gameStateRef.current;
    const leading = [...state.horses].sort((a, b) => b.x - a.x);
    const targetCameraX = Math.max(0, leading[0].x - CAMERA_OFFSET);
    state.cameraX += (targetCameraX - state.cameraX) * 0.12;
    
    drawBackground(ctx, state.cameraX);
    
    let allFinished = true;
    const sortedHorses = [...state.horses].sort((a, b) => a.lane - b.lane);
    
    sortedHorses.forEach((horse) => {
      if (!horse.finished) {
        allFinished = false;
        
        if (Math.random() < 0.03) horse.boostTimer = 30 + Math.floor(Math.random() * 30);
        if (Math.random() < 0.02) horse.slowTimer = 25 + Math.floor(Math.random() * 25);
        
        let currentSpeed = horse.baseSpeed;
        if (horse.boostTimer > 0) { currentSpeed *= 1.8; horse.boostTimer--; }
        if (horse.slowTimer > 0) { currentSpeed *= 0.3; horse.slowTimer--; }
        currentSpeed += (Math.random() - 0.5) * 0.6;
        currentSpeed = Math.max(1.2, currentSpeed);
        
        const playerFinished = state.finished.some(h => h.isPlayer);
        if (playerFinished && !horse.isPlayer) currentSpeed *= 3.0;
        
        horse.x += currentSpeed;
        horse.frame++;
        
        if (horse.x >= GOAL_X) {
          horse.finished = true;
          horse.x = GOAL_X;
          state.finished.push({ id: horse.id, name: horse.name, isPlayer: horse.isPlayer, rank: state.finished.length + 1 });
        }
      }
      
      const y = TRACK_TOP + horse.lane * LANE_HEIGHT + 8;
      drawHorse(ctx, horse.x, y, horse.colors, horse.frame, horse.name, horse.isPlayer, state.cameraX);
    });
    
    const remainingDist = Math.max(0, Math.round(GOAL_X - leading[0].x));
    ctx.fillStyle = GOLD;
    ctx.font = "bold 16px 'DotGothic16', monospace";
    ctx.textAlign = 'right';
    ctx.fillText(`残り ${remainingDist}m`, CANVAS_WIDTH - 20, TRACK_TOP - 25);
    
    ctx.fillStyle = '#FFFFFF';
    ctx.font = "bold 20px 'DotGothic16', monospace";
    ctx.textAlign = 'left';
    
    const leaderName = leading[0]?.name || '';
    const secondName = leading[1]?.name || '';
    const progress = (leading[0]?.x - START_X) / (GOAL_X - START_X);
    
    let commentary;
    if (state.finished.length >= 5) commentary = 'ゴールラッシュ！続々とゴールイン！';
    else if (state.finished.length >= 3) commentary = `${state.finished[state.finished.length-1].name}もゴール！`;
    else if (state.finished.length >= 1) commentary = `先頭は${state.finished[0].name}！勝負あり！`;
    else if (progress > 0.85) commentary = `最後の直線！${leaderName}先頭！`;
    else if (progress > 0.7) commentary = `第4コーナーをまわって${leaderName}！`;
    else if (progress > 0.5) {
      const gap = leading[0].x - leading[1].x;
      commentary = gap < 30 ? `${leaderName}と${secondName}が並んだ！` : `${leaderName}がリード！追う${secondName}！`;
    } else if (progress > 0.3) commentary = `向こう正面！${leaderName}が引っ張る！`;
    else if (progress > 0.15) commentary = `そとから${leaderName}がつっこんできた！`;
    else commentary = 'スタート！各馬一斉に飛び出した！';
    
    ctx.fillText(commentary, 20, CANVAS_HEIGHT - 35);
    
    ctx.font = "14px 'DotGothic16', monospace";
    ctx.fillStyle = GOLD;
    ctx.textAlign = 'right';
    ctx.fillText(`ゴール: ${state.finished.length}/7頭`, CANVAS_WIDTH - 20, CANVAS_HEIGHT - 35);
    
    ctx.textAlign = 'left';
    ctx.font = "12px 'DotGothic16', monospace";
    ctx.fillStyle = '#FFFFFF';
    ctx.fillText('現在順位:', 20, CANVAS_HEIGHT - 12);
    leading.slice(0, 5).forEach((horse, idx) => {
      ctx.fillStyle = horse.isPlayer ? GOLD : '#FFFFFF';
      ctx.fillText(`${idx + 1}.${horse.name}`, 100 + idx * 100, CANVAS_HEIGHT - 12);
    });
    
    if (allFinished) {
      const playerResult = state.finished.find(h => h.isPlayer);
      const rank = playerResult ? playerResult.rank : 7;
      setPlayerRank(rank);
      setFinishedHorses(state.finished);
      setOmikujiData(generateOmikuji(rank));
      setScene('result');
      return;
    }
    
    animationRef.current = requestAnimationFrame(gameLoop);
  }, [drawBackground, drawHorse, CANVAS_WIDTH, CANVAS_HEIGHT, TRACK_TOP, LANE_HEIGHT, CAMERA_OFFSET, START_X, GOAL_X, GOLD]);

  const startRace = useCallback(() => {
    if (!playerName.trim()) { alert('名前を入力してください！'); return; }
    setShowDetail(false);
    setScene('race');
  }, [playerName]);

  useEffect(() => {
    if (scene === 'race') {
      initRace();
      const timer = setTimeout(() => { animationRef.current = requestAnimationFrame(gameLoop); }, 500);
      return () => { clearTimeout(timer); if (animationRef.current) cancelAnimationFrame(animationRef.current); };
    }
  }, [scene, initRace, gameLoop]);

  if (scene === 'start') {
    return (
      <div className="min-h-screen flex items-center justify-center p-4" style={{ background: `linear-gradient(180deg, ${CRIMSON} 0%, #6a0018 100%)`, fontFamily: "'DotGothic16', monospace" }}>
        <div className="text-center p-6 md:p-10 rounded-lg w-full max-w-lg" style={{ background: 'linear-gradient(180deg, #1a1a1a 0%, #0a0a0a 100%)', border: `6px solid ${GOLD}`, boxShadow: `0 0 40px ${GOLD}40` }}>
          <div className="mb-8">
            <div style={{ color: GOLD }} className="text-base md:text-lg mb-3">🐴 2026年 干支ゲーム 🐴</div>
            <h1 className="text-3xl md:text-4xl font-bold text-white mb-3" style={{ textShadow: `3px 3px ${CRIMSON}`, letterSpacing: '4px' }}>午年！爆走</h1>
            <h1 className="text-3xl md:text-4xl font-bold" style={{ color: GOLD, textShadow: '3px 3px #000', letterSpacing: '4px' }}>おみくじ競馬</h1>
          </div>
          <div className="text-xl mb-8" style={{ color: GOLD }}>{'🏇'.repeat(7)}</div>
          <div className="mb-8">
            <label className="block text-white text-lg mb-3">あなたの名前（カタカナ）</label>
            <input type="text" value={playerName} onChange={(e) => setPlayerName(e.target.value)} placeholder="ナマエ" maxLength={6} className="w-full max-w-xs px-6 py-4 text-center text-xl rounded" style={{ background: '#f0e6d3', border: `4px solid ${GOLD}`, fontFamily: "'DotGothic16', monospace" }} />
          </div>
          <button onClick={startRace} className="px-10 py-5 text-2xl font-bold text-white rounded transition-all hover:scale-105 active:scale-95" style={{ background: `linear-gradient(180deg, ${CRIMSON} 0%, #6a0018 100%)`, border: `4px solid ${GOLD}`, boxShadow: `0 4px 0 #4a0000`, textShadow: '2px 2px #000' }}>🏁 出走！ 🏁</button>
          <div className="mt-8 text-gray-400 text-sm md:text-base">
            <p>7頭でレース！順位でおみくじが決まる！</p>
            <p className="mt-1">1位＝大吉 〜 7位＝大凶</p>
          </div>
        </div>
      </div>
    );
  }

  if (scene === 'race') {
    return (
      <div className="min-h-screen flex flex-col items-center justify-center p-2 md:p-4" style={{ background: '#000000', fontFamily: "'DotGothic16', monospace" }}>
        <div className="w-full max-w-3xl">
          <div className="text-center mb-3">
            <h2 className="text-xl md:text-2xl font-bold" style={{ color: GOLD, textShadow: '2px 2px #000' }}>🏇 レース進行中！ 🏇</h2>
          </div>
          <div className="w-full" style={{ border: `6px solid ${GOLD}`, borderRadius: '4px', boxShadow: `0 0 30px ${GOLD}30` }}>
            <canvas ref={canvasRef} width={CANVAS_WIDTH} height={CANVAS_HEIGHT} style={{ display: 'block', width: '100%', height: 'auto', imageRendering: 'pixelated' }} />
          </div>
          <div className="mt-4 flex flex-wrap justify-center gap-4 md:gap-8 text-white text-sm md:text-base">
            <span>▼ = あなた</span>
            <span style={{ color: GOLD }}>金文字 = あなたの馬</span>
          </div>
        </div>
      </div>
    );
  }

  if (scene === 'result' && omikujiData) {
    if (showDetail) {
      return (
        <div className="min-h-screen flex items-center justify-center p-2 md:p-4" style={{ background: `linear-gradient(180deg, ${CRIMSON} 0%, #4a0018 100%)`, fontFamily: "'DotGothic16', monospace" }}>
          <div className="w-full max-w-md" style={{ background: 'linear-gradient(180deg, #f5e6d3 0%, #e8d4b8 100%)', border: `4px solid ${GOLD}`, borderRadius: '8px', boxShadow: `0 0 40px ${GOLD}50` }}>
            <div className="text-center py-5" style={{ background: `linear-gradient(180deg, ${CRIMSON} 0%, #6a0018 100%)`, borderBottom: `4px solid ${GOLD}` }}>
              <div style={{ color: GOLD }} className="text-sm mb-1">午年 開運おみくじ</div>
              <div className="text-white text-3xl md:text-4xl font-bold" style={{ textShadow: '2px 2px #000' }}>御 神 籤</div>
            </div>
            <div className="text-center py-6" style={{ borderBottom: `2px dashed ${CRIMSON}` }}>
              <div className="text-gray-600 text-base mb-2">第{playerRank}着</div>
              <div className="text-6xl md:text-7xl font-bold mb-3" style={{ color: omikujiData.color, textShadow: '3px 3px rgba(0,0,0,0.2)' }}>{omikujiData.result}</div>
              <div className="text-base text-gray-700 px-6">{omikujiData.comment}</div>
            </div>
            <div className="px-4 md:px-6 py-4" style={{ borderBottom: `2px dashed ${CRIMSON}` }}>
              <div className="text-center text-sm text-gray-500 mb-2">【運勢】</div>
              <p className="text-gray-800 text-base leading-relaxed text-center italic">「{omikujiData.fortune}」</p>
            </div>
            <div className="px-3 md:px-4 py-4 space-y-3">
              {Object.entries(omikujiData.categories).map(([category, text]) => (
                <div key={category} className="flex items-start gap-3 p-3 rounded" style={{ background: 'rgba(184, 0, 40, 0.1)' }}>
                  <div className="flex-shrink-0 w-14 text-center py-2 rounded text-white text-sm font-bold" style={{ background: category === '勝負' ? GOLD : CRIMSON }}>{category}</div>
                  <div className="flex-1 text-gray-700 text-base leading-relaxed">{text}</div>
                </div>
              ))}
            </div>
            <div className="text-center py-5" style={{ background: 'linear-gradient(180deg, #d4c4a8 0%, #c4b498 100%)', borderTop: `2px solid ${CRIMSON}` }}>
              <div className="text-sm text-gray-600 mb-4">🐴 2026年 午年 🐴</div>
              <button onClick={() => setShowDetail(false)} className="px-8 py-3 text-base font-bold text-white rounded transition-all hover:scale-105" style={{ background: 'linear-gradient(180deg, #4a4a4a 0%, #2a2a2a 100%)', border: '3px solid #666' }}>← 結果に戻る</button>
            </div>
          </div>
        </div>
      );
    }
    
    return (
      <div className="min-h-screen flex items-center justify-center p-2 md:p-4" style={{ background: playerRank <= 3 ? `linear-gradient(180deg, #3a2a00 0%, #1a1200 100%)` : `linear-gradient(180deg, ${CRIMSON} 0%, #4a0018 100%)`, fontFamily: "'DotGothic16', monospace" }}>
        <div className="text-center p-6 md:p-8 rounded-lg w-full max-w-lg" style={{ background: 'rgba(0, 0, 0, 0.7)', border: `6px solid ${omikujiData.color}`, boxShadow: `0 0 40px ${omikujiData.color}50` }}>
          <div className="text-white text-xl mb-3">🏁 レース結果 🏁</div>
          <div className="text-7xl mb-4">{playerRank === 1 ? '🥇' : playerRank === 2 ? '🥈' : playerRank === 3 ? '🥉' : '🏇'}</div>
          <div className="text-white text-2xl md:text-3xl mb-4" style={{ textShadow: '2px 2px #000' }}>{playerName || 'プレイヤー'}<br /><span className="text-5xl font-bold" style={{ color: omikujiData.color }}>{playerRank}着！</span></div>
          <div className="my-6 p-6 rounded" style={{ background: 'linear-gradient(180deg, #f0e6d3 0%, #d4c4a8 100%)', border: `4px solid ${GOLD}` }}>
            <div className="text-base text-gray-600 mb-2">おみくじ結果</div>
            <div className="text-6xl font-bold mb-3" style={{ color: omikujiData.color, textShadow: '3px 3px rgba(0,0,0,0.2)' }}>{omikujiData.result}</div>
            <div className="text-gray-700 text-base leading-relaxed">{omikujiData.comment}</div>
          </div>
          <div className="mb-6 text-left p-4 rounded" style={{ background: 'rgba(255,255,255,0.1)' }}>
            <div className="text-white text-base mb-3 text-center">📋 全着順 📋</div>
            <div className="grid grid-cols-1 gap-2 text-sm md:text-base">
              {finishedHorses.map((horse, idx) => (
                <div key={horse.id} className={`flex justify-between px-3 py-2 rounded ${horse.isPlayer ? 'font-bold' : 'text-white'}`} style={{ background: horse.isPlayer ? GOLD : 'transparent', color: horse.isPlayer ? '#000' : '#fff' }}>
                  <span>{idx + 1}着</span>
                  <span>{horse.name}</span>
                  <span style={{ color: horse.isPlayer ? '#000' : '#999' }}>{OMIKUJI_DATABASE[idx + 1].result}</span>
                </div>
              ))}
            </div>
          </div>
          <button onClick={() => setShowDetail(true)} className="px-10 py-5 text-xl font-bold text-white rounded transition-all hover:scale-105 active:scale-95" style={{ background: `linear-gradient(180deg, ${omikujiData.color} 0%, ${omikujiData.color}88 100%)`, border: `4px solid ${GOLD}`, boxShadow: '0 4px 0 rgba(0,0,0,0.4)', textShadow: '2px 2px #000' }}>📜 詳しく見る 📜</button>
          <div className="mt-5 text-gray-400 text-sm">2026年も良い年になりますように！🐴</div>
        </div>
      </div>
    );
  }

  return null;
}

ReactDOM.createRoot(document.getElementById('root')).render(<HorseOmikujiGame />);
</script>
</body>
</html>
