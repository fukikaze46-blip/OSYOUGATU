<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layout Check</title>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Shippori Mincho', serif;
      background-color: #f0f0f0;
      overflow-x: hidden; /* 横スクロール防止 */
    }

    /* ▼ メインビジュアルのコンテナ（ポスターのようなレイアウト） */
    .hero-container {
      position: relative;
      width: 100%;
      height: 100vh; /* 画面いっぱいの高さ */
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* 1. 背景の分割（上：白、下：赤） */
    .bg-top {
      height: 45%; /* 上45%が白 */
      background-color: #ffffff;
      width: 100%;
    }
    .bg-bottom {
      height: 55%; /* 下55%が赤 */
      background-color: #B80028;
      width: 100%;
      position: relative;
    }

    /* 2. 左端の巨大な英語縦書き */
    .side-text {
      position: absolute;
      top: 0;
      left: 2%;
      height: 100%;
      writing-mode: vertical-rl; /* 縦書き */
      text-orientation: mixed;
      font-family: 'Times New Roman', serif; /* 明朝系の英語フォント */
      font-size: min(12vh, 8vw); /* 画面サイズに合わせて調整 */
      font-weight: 100;
      color: #111; /* 黒文字 */
      line-height: 1;
      z-index: 10;
      letter-spacing: 0.05em;
      white-space: nowrap;
    }
    /* 下半分の文字色を反転させるギミック（mix-blend-modeは背景によるので今回は黒のまま透過で調整） */
    .side-text {
      mix-blend-mode: difference; /* 背景が白なら黒、赤なら補色っぽくなる演出 */
      color: #fff; /* differenceを使うので白指定にすると、白背景で黒、赤背景で青緑っぽくなる */
      /* もし完全に黒にしたい場合は mix-blend-mode を外して color: #000 にしてください */
      mix-blend-mode: normal;
      color: #000;
      opacity: 0.8;
    }

    /* 3. 右上の巨大な「丙午」 */
    .kanji-big {
      position: absolute;
      top: -5%;
      right: -5%;
      font-size: 40vh; /* 画面の40%の大きさ */
      font-weight: 900;
      color: #C5A059; /* 金色っぽい色 */
      line-height: 1;
      z-index: 1;
      opacity: 0.9;
    }
    .kanji-big .char-2 {
      display: block;
      margin-top: -0.2em; /* 文字を少し重ねる */
      margin-left: 0.5em;
    }
    /* 下の「午」は赤背景にも被るので色調整が必要かもですが、一旦配置優先 */

    /* 4. 中央の馬（重なり） */
    .center-horse {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -60%); /* 中央配置 */
      width: 60%; /* 画像サイズ */
      max-width: 600px;
      z-index: 5;
    }

    /* 5. 挨拶文エリア（赤背景の中） */
    .greeting-text {
      position: absolute;
      bottom: 10%;
      left: 20%; /* 左の英語と被らないように */
      color: rgba(255, 255, 255, 0.8);
      font-size: 0.9rem;
      line-height: 2;
      z-index: 6;
      text-align: left;
    }
    .greeting-title {
      font-size: 1.5rem;
      font-weight: bold;
      margin-bottom: 1rem;
      color: #fff;
    }

    /* レスポンシブ調整（スマホ） */
    @media (max-width: 768px) {
      .side-text { font-size: 8vh; left: 10px; }
      .kanji-big { font-size: 30vh; right: -10%; }
      .center-horse { width: 90%; transform: translate(-45%, -55%); }
      .greeting-text { left: 15%; font-size: 0.75rem; bottom: 5%; width: 80%; }
    }
  </style>
</head>
<body>

  <div class="hero-container">
    <div class="bg-top"></div>
    <div class="bg-bottom">
      <div class="greeting-text">
        <div class="greeting-title">丙午</div>
        <p>
          謹んで新春のお慶びを申し上げます。<br><br>
          六十年の時を経て巡りきたる「丙午（ひのえうま）」。<br>
          太陽と生命力が重なるこの年は、強烈な陽の気であらゆる厄災を焼き払います。<br>
          大地を蹴る炎の馬のごとく、今こそ内なる情熱を解き放つ時。<br>
          新たな時代を切り拓く一年でありたいと願います。
        </p>
      </div>
    </div>

    <div class="side-text">
      Happy New Yare2026
    </div>

    <div class="kanji-big">
      <div>丙</div>
      <div class="char-2" style="color: #9f803e; /* 下の文字は少し暗く? */">午</div>
    </div>

    <img src="./horse.jpg" class="center-horse" alt="丙午の馬">

  </div>

  <div style="position: relative;">
    <img src="./shrine.jpg" style="width: 100%; display: block;" alt="神社">
    </div>

  <div style="background: white; padding: 4rem 2rem; display: flex; justify-content: center; align-items: center; gap: 2rem; flex-wrap: wrap;">
    <div style="max-width: 500px;">
      <h2 style="color: #B80028; font-weight: bold; margin-bottom: 1rem;">まだ全然やることが終わってない！！</h2>
      <p style="font-size: 0.9rem; line-height: 1.8;">旧年中は大変お世話になりました...</p>
    </div>
    <img src="./girl.png" style="width: 200px;" alt="女の子">
  </div>

</body>
</html>
