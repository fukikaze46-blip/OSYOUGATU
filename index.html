<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>丙午 2026 - HINOEUMA</title>
  
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;700;900&family=DotGothic16&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Shippori Mincho', serif; background-color: #fff; overflow-x: hidden; }
    /* 縦書き用 */
    .vertical-text { writing-mode: vertical-rl; text-orientation: mixed; }
    /* ドット絵用（画像をぼかさずクッキリ表示） */
    .pixelated { image-rendering: pixelated; }
    /* ブレンドモード用（背景色に合わせて文字色を反転） */
    .mix-difference { mix-blend-mode: difference; color: white; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const { motion, AnimatePresence, useScroll, useTransform } = window.Motion;

    // ==========================================
    // ⚙️ 設定項目
    // ==========================================
    // ★ここにゲームのURLを貼り付けてください★
    const GAME_URL = "https://google.com"; 

    const ASSETS = {
      // ローディング用（img1〜img6は以前作成したものを使用）
      fonts: ['./img1.png', './img2.png', './img3.png', './img4.png', './img5.png', './img6.png'],
      stamp: './loading.png',
      // メイン用（今回リネームしたもの）
      bg_text: './bg_text.jpg',
      horse: './horse.jpg',
      shrine: './shrine.jpg',
      girl: './girl.png',
    };

    // ==========================================
    // ❄️ 雪のエフェクト (ドット絵用)
    // ==========================================
    const SnowEffect = () => (
      <div className="absolute inset-0 pointer-events-none overflow-hidden z-20">
        {Array.from({ length: 50 }).map((_, i) => (
          <motion.div
            key={i}
            // ドット絵らしく四角い雪にする
            className="absolute bg-white opacity-80"
            initial={{ x: Math.random() * 100 + "%", y: -10 }}
            animate={{ y: "110vh", x: `calc(${Math.random() * 100}% + ${Math.random() * 20 - 10}px)` }}
            transition={{ duration: 4 + Math.random() * 4, repeat: Infinity, ease: "linear", delay: Math.random() * 5 }}
            style={{ 
              width: Math.random() > 0.5 ? '4px' : '8px', 
              height: Math.random() > 0.5 ? '4px' : '8px',
              imageRendering: 'pixelated'
            }}
          />
        ))}
      </div>
    );

    // ==========================================
    // 🔄 ローディング画面（前回と同じ）
    // ==========================================
    const LoadingScreen = ({ onComplete }) => {
      const [progress, setProgress] = useState(0);
      const [fontIndex, setFontIndex] = useState(0);
      const [showStamp, setShowStamp] = useState(false);
      const [slideUp, setSlideUp] = useState(false);

      useEffect(() => {
        const timer = setInterval(() => setProgress(p => (p >= 100 ? 100 : p + 1)), 30);
        const flick = setInterval(() => setFontIndex(i => (i + 1) % ASSETS.fonts.length), 150);
        return () => { clearInterval(timer); clearInterval(flick); };
      }, []);

      useEffect(() => {
        if (progress === 100) {
          setTimeout(() => setShowStamp(true), 400);
          setTimeout(() => setSlideUp(true), 2000);
          setTimeout(onComplete, 2700);
        }
      }, [progress, onComplete]);

      return (
        <motion.div
          className="fixed inset-0 z-[100] bg-white flex flex-col items-center justify-center"
          animate={slideUp ? { y: '-100%' } : { y: 0 }}
          transition={{ duration: 0.8, ease: [0.76, 0, 0.24, 1] }}
        >
          <div className="absolute top-6 left-6 text-xs tracking-widest">2025→2026</div>
          <div className="absolute top-6 right-6 text-xs tracking-widest">hello 2026</div>
          
          <div className="relative w-full max-w-2xl h-64 flex items-center justify-center">
             {!showStamp && ASSETS.fonts.map((src, i) => (
               <img key={i} src={src} className="absolute h-32 md:h-48 object-contain transition-opacity duration-75" style={{ opacity: fontIndex === i ? 1 : 0 }} />
             ))}
             <AnimatePresence>
               {showStamp && (
                 <motion.img src={ASSETS.stamp} initial={{ scale: 3, opacity: 0, rotate: -5 }} animate={{ scale: 1, opacity: 1, rotate: 0 }} transition={{ type: 'spring', stiffness: 200 }} className="absolute h-48 md:h-64 object-contain" />
               )}
             </AnimatePresence>
          </div>
          <div className="absolute bottom-1/4 tracking-[0.3em] font-['DotGothic16']">loading - {String(progress).padStart(3, '0')}%</div>
        </motion.div>
      );
    };

    // ==========================================
    // 🏠 メインアプリ
    // ==========================================
    const App = () => {
      const [isLoading, setIsLoading] = useState(true);
      const { scrollY } = useScroll();
      
      // パララックス用（スクロールに応じた移動量）
      const y_slow = useTransform(scrollY, [0, 1000], [0, 150]);
      const y_fast = useTransform(scrollY, [0, 1000], [0, -200]);

      return (
        <>
          <AnimatePresence>
            {isLoading && <LoadingScreen onComplete={() => setIsLoading(false)} />}
          </AnimatePresence>

          <div className="relative font-sans">
            
            {/* ========================================
              1. Hero Section (ポスター風レイアウト)
              ========================================
              ここを大胆に変更しました。絶対配置(absolute)で要素を重ねています。
            */}
            <section className="relative h-screen w-full overflow-hidden bg-[#B80028]">
              
              {/* 背景（上半分を白にするための要素） */}
              <div className="absolute top-0 left-0 w-full h-[55%] bg-white z-0"></div>

              {/* 左側の巨大な縦書き英語 (mix-blend-modeで色を反転) */}
              <div className="absolute top-0 left-4 h-full z-20 mix-difference pointer-events-none">
                <h2 className="vertical-text text-[12vh] leading-none font-thin tracking-wider opacity-90 font-serif">
                  Happy New Yare2026
                </h2>
              </div>

              {/* 右上の巨大な「丙午」 (金色) */}
              <motion.div style={{ y: y_slow }} className="absolute -top-[5%] -right-[10%] z-10 pointer-events-none select-none">
                <h1 className="text-[45vh] font-black text-[#C5A059] leading-none opacity-90 font-serif">
                  丙<br/>
                  <span className="ml-[0.5em] -mt-[0.2em] block text-[#9f803e]">午</span>
                </h1>
              </motion.div>

              {/* 中央の馬 (境界線をまたいで配置＆浮遊アニメーション) */}
              <motion.div 
                className="absolute top-1/2 left-1/2 z-30 w-[80%] md:w-[60%] max-w-[700px]"
                style={{ x: '-50%', y: '-55%' }} // 中心から少し上にずらす
                animate={{ y: ['-55%', '-58%', '-55%'] }} // ふわふわ浮遊
                transition={{ duration: 4, repeat: Infinity, ease: "easeInOut" }}
              >
                 <img src={ASSETS.horse} className="w-full drop-shadow-2xl" alt="丙午の馬" />
              </motion.div>

              {/* 赤背景部分の挨拶テキスト */}
              <div className="absolute bottom-[8%] left-[15%] md:left-[25%] z-30 text-white opacity-90 leading-relaxed text-sm md:text-base font-medium">
                <p className="text-2xl font-bold mb-4">丙午</p>
                <p>謹んで新春のお慶びを申し上げます。<br/>
                六十年の時を経て巡りきたる「丙午」。<br/>
                太陽と生命力が重なるこの年は、<br/>
                強烈な陽の気であらゆる厄災を焼き払います。<br/>
                大地を蹴る炎の馬のごとく、今こそ内なる情熱を解き放つ時。<br/>
                新たな時代を切り拓く一年でありたいと願います。</p>
              </div>
            </section>


            {/* ========================================
              2. Shrine Section (ドット絵アニメーションリンク)
              ========================================
              画像をクリックするとURLへ飛びます。
              CSSアニメーションでドット絵が生きているような演出を加えています。
            */}
            <section className="relative h-screen overflow-hidden bg-black z-40">
              <a 
                href={GAME_URL} // ★ここに設定したURLが使われます★
                target="_blank" 
                rel="noopener noreferrer"
                className="block w-full h-full relative group cursor-pointer overflow-hidden"
              >
                {/* ドット絵背景 (ピコピコ動くアニメーション) */}
                <motion.div
                  className="w-full h-full"
                  animate={{ y: [0, -10, 0] }} // 上下に少し揺れる
                  transition={{ duration: 2, repeat: Infinity, ease: "steps(10)" }} // stepsを使うとコマ送りっぽくなる
                >
                  <img 
                    src={ASSETS.shrine} 
                    className="w-full h-full object-cover opacity-80 pixelated scale-[1.02] group-hover:scale-110 transition-transform duration-700" 
                    alt="神社リンク"
                  />
                </motion.div>

                {/* 雪エフェクト */}
                <SnowEffect />

                {/* ホバー時の演出（黄色く光る＋文字が出る） */}
                <div className="absolute inset-0 bg-yellow-500/0 group-hover:bg-yellow-500/20 transition-all duration-500 flex flex-col items-center justify-center">
                  <p className="text-white font-['DotGothic16'] text-3xl tracking-[0.5em] font-bold opacity-0 group-hover:opacity-100 transition-opacity duration-500 scale-150 group-hover:scale-100">
                    参拝スル
                  </p>
                  <p className="text-white/80 font-['DotGothic16'] text-sm mt-4 opacity-0 group-hover:opacity-100 transition-opacity duration-700 delay-100">
                    (Click to Play Game)
                  </p>
                </div>
              </a>
            </section>


            {/* ========================================
              3. Footer Section (フッター)
              ========================================
            */}
            <section className="min-h-[80vh] bg-white py-20 px-6 flex items-center justify-center relative z-50">
              <div className="max-w-5xl w-full flex flex-wrap-reverse md:flex-nowrap gap-12 items-center justify-between">
                
                <div className="flex-1 space-y-6">
                  <h2 className="text-2xl md:text-3xl font-bold text-[#B80028]">まだ全然やることが終わってない！！</h2>
                  <div className="text-gray-700 leading-8 space-y-4 text-justify text-sm md:text-base">
                    <p>旧年中は大変お世話になりました。皆様のおかげで無事に2026年を迎えることができました。</p>
                    <p>実のところ、2025年はやるべきことを完遂できず、悔いの残る形となってしまいました……。決して誇れることではありませんが、気持ちを切り替えて、まずは目の前の課題を一つひとつ片付けていく所存です。</p>
                    <p className="font-bold text-[#B80028]">早くやるべきことを終わらせて、心置きなくドラマを楽しみたいと思います。</p>
                  </div>
                </div>
                
                <motion.div style={{ y: y_slow }} className="relative text-center flex-shrink-0 mx-auto md:mx-0">
                   <div className="absolute -top-8 -left-8 bg-white border-2 border-gray-200 p-3 rounded-full shadow-lg z-10 animate-bounce">
                     <p className="text-xs text-gray-500 font-bold font-['DotGothic16']">ま……間に合わない</p>
                   </div>
                   <img src={ASSETS.girl} className="w-56 md:w-72" alt="キャラクター" />
                </motion.div>

              </div>
              
              <footer className="absolute bottom-4 w-full text-center text-xs text-gray-400 font-['DotGothic16']">
                © 2026 HINOEUMA Project
              </footer>
            </section>

          </div>
        </>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
