<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>丙午 2026 - HINOEUMA</title>
  
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;900&family=DotGothic16&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
  
  <style>
    body { 
      font-family: 'Shippori Mincho', serif; 
      background-color: #fff; 
      overflow-x: hidden; 
      margin: 0;
    }
    /* 縦書き設定 */
    .vertical-rl { writing-mode: vertical-rl; text-orientation: mixed; }
    
    /* ドット絵をくっきり表示 */
    .pixelated { image-rendering: pixelated; }

    /* スクロールバー装飾 */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; }
    ::-webkit-scrollbar-thumb { background: #B80028; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const { motion, AnimatePresence, useScroll, useTransform } = window.Motion;

    // ==========================================
    // 🔗 ゲームのURL設定
    // ==========================================
    // ここに飛ばしたいゲームのURLを入れてください
    const GAME_URL = "https://fukikaze46-blip.github.io/furanoesports/"; 

    const ASSETS = {
      fonts: ['./img1.png', './img2.png', './img3.png', './img4.png', './img5.png', './img6.png'],
      stamp: './loading.png',
      horse: './horse.jpg',
      shrine: './shrine.jpg',
      girl: './girl.png',
    };

    // ==========================================
    // ❄️ 雪エフェクト
    // ==========================================
    const SnowEffect = () => (
      <div className="absolute inset-0 pointer-events-none overflow-hidden z-20">
        {Array.from({ length: 40 }).map((_, i) => (
          <motion.div
            key={i}
            className="absolute bg-white opacity-90"
            initial={{ x: Math.random() * 100 + "%", y: -10 }}
            animate={{ y: "110vh", x: `calc(${Math.random() * 100}% + ${Math.random() * 20 - 10}px)` }}
            transition={{ duration: 3 + Math.random() * 4, repeat: Infinity, ease: "linear", delay: Math.random() * 5 }}
            style={{ 
              width: Math.random() > 0.5 ? '3px' : '6px', 
              height: Math.random() > 0.5 ? '3px' : '6px',
              imageRendering: 'pixelated'
            }}
          />
        ))}
      </div>
    );

    // ==========================================
    // 🔄 ローディング画面
    // ==========================================
    const LoadingScreen = ({ onComplete }) => {
      const [progress, setProgress] = useState(0);
      const [fontIndex, setFontIndex] = useState(0);
      const [showStamp, setShowStamp] = useState(false);
      const [slideUp, setSlideUp] = useState(false);

      useEffect(() => {
        const timer = setInterval(() => setProgress(p => (p >= 100 ? 100 : p + 1)), 25);
        const flick = setInterval(() => setFontIndex(i => (i + 1) % ASSETS.fonts.length), 120);
        return () => { clearInterval(timer); clearInterval(flick); };
      }, []);

      useEffect(() => {
        if (progress === 100) {
          setTimeout(() => setShowStamp(true), 300);
          setTimeout(() => setSlideUp(true), 1800);
          setTimeout(onComplete, 2500);
        }
      }, [progress, onComplete]);

      return (
        <motion.div
          className="fixed inset-0 z-[100] bg-white flex flex-col items-center justify-center"
          animate={slideUp ? { y: '-100%' } : { y: 0 }}
          transition={{ duration: 0.8, ease: [0.76, 0, 0.24, 1] }}
        >
          <div className="absolute top-6 left-6 text-xs tracking-widest font-sans">2025→2026</div>
          <div className="absolute top-6 right-6 text-xs tracking-widest font-sans">hello 2026</div>
          
          <div className="relative w-full max-w-2xl h-64 flex items-center justify-center">
             {!showStamp && ASSETS.fonts.map((src, i) => (
               <img key={i} src={src} className="absolute h-32 md:h-48 object-contain" style={{ opacity: fontIndex === i ? 1 : 0 }} />
             ))}
             <AnimatePresence>
               {showStamp && (
                 <motion.img src={ASSETS.stamp} initial={{ scale: 3, opacity: 0, rotate: -5 }} animate={{ scale: 1, opacity: 1, rotate: 0 }} transition={{ type: 'spring', stiffness: 200 }} className="absolute h-48 md:h-64 object-contain" />
               )}
             </AnimatePresence>
          </div>
          <div className="absolute bottom-1/4 tracking-[0.3em] font-mono text-sm">loading - {String(progress).padStart(3, '0')}%</div>
        </motion.div>
      );
    };

    // ==========================================
    // 🏠 メインアプリ
    // ==========================================
    const App = () => {
      const [isLoading, setIsLoading] = useState(true);
      const { scrollY } = useScroll();
      
      const y_horse = useTransform(scrollY, [0, 800], [0, 100]); // 馬が少し遅れて動く
      const y_kanji = useTransform(scrollY, [0, 800], [0, -100]); // 漢字が逆に動く

      return (
        <>
          <AnimatePresence>
            {isLoading && <LoadingScreen onComplete={() => setIsLoading(false)} />}
          </AnimatePresence>

          <div className="relative w-full overflow-hidden">
            
            {/* ========================================
              SECTION 1: THE POSTER HERO
              ========================================
              イラレのデザインを座標で完全に再現するセクション
            */}
            <section className="relative w-full h-[120vh] md:h-screen bg-[#C3002F] overflow-hidden">
              
              {/* 1. 背景の白部分（上40%） */}
              <div className="absolute top-0 left-0 w-full h-[38%] bg-white z-0"></div>

              {/* 2. 左端の縦書き英語 "Happy New Yare2026" */}
              {/* 画面左端に固定。白エリアでは黒、赤エリアでも黒（画像準拠） */}
              <div className="absolute top-0 left-[2%] md:left-[4%] h-full z-20 pointer-events-none">
                <h2 className="vertical-rl text-[11vh] md:text-[14vh] leading-none font-thin tracking-widest font-serif text-black opacity-90"
                    style={{ fontFamily: "'Cinzel', serif" }}>
                  Happy New Yare2026
                </h2>
              </div>

              {/* 3. 右側の巨大な「丙午」 */}
              {/* 「丙」は白背景、「午」は赤背景。金色(#C5A059) */}
              <motion.div 
                style={{ y: y_kanji }}
                className="absolute top-[-2%] right-[5%] z-10 pointer-events-none select-none leading-none"
              >
                <div className="text-[35vh] md:text-[45vh] font-black text-[#C5A059] font-serif leading-none">
                  丙
                </div>
                <div className="text-[35vh] md:text-[45vh] font-black text-[#a68543] font-serif leading-none -mt-[0.3em] ml-[0.4em]">
                  午
                </div>
              </motion.div>

              {/* 4. 中央の馬 */}
              {/* 境界線(38%)の上に配置 */}
              <motion.div 
                className="absolute left-1/2 z-30 w-[85%] md:w-[50%] max-w-[600px]"
                style={{ top: '38%', x: '-50%', y: '-55%' }} // 中心基準配置
                animate={{ y: ['-55%', '-57%', '-55%'] }} // ふわふわ
                transition={{ duration: 5, repeat: Infinity, ease: "easeInOut" }}
              >
                 <img src={ASSETS.horse} className="w-full drop-shadow-xl" alt="丙午の馬" />
              </motion.div>

              {/* 5. 赤背景の白文字テキスト */}
              <div className="absolute bottom-[10%] left-[20%] md:left-[30%] z-20 text-white text-xs md:text-sm font-medium leading-loose tracking-wide">
                <p className="text-xl md:text-2xl font-bold mb-4">丙午</p>
                <p>謹んで新春のお慶びを申し上げます。</p>
                <br/>
                <p>六十年の時を経て巡りきたる「丙午（ひのえうま）」。<br/>
                太陽と生命力が重なるこの年は、強烈な陽の気であらゆる厄災を焼き払います。</p>
                <p>大地を蹴る炎の馬のごとく、今こそ内なる情熱を解き放つ時。<br/>
                迷いを捨て、向かい風さえも推進力に変えて、己の信じる道をひた走る。</p>
                <p>新たな時代を切り拓く一年でありたいと願います。</p>
                <br/>
                <p className="opacity-70">本年が皆様にとって、情熱と飛躍の素晴らしい年となりますように。</p>
              </div>
            </section>


            {/* ========================================
              SECTION 2: THE SHRINE LINK
              ========================================
              社を押すとゲームへ
            */}
            <section className="relative w-full aspect-[16/9] md:h-screen bg-black overflow-hidden z-40 border-t-8 border-white">
              <a 
                href={GAME_URL} 
                target="_blank" 
                rel="noopener noreferrer"
                className="block w-full h-full relative group cursor-pointer"
              >
                {/* 背景画像（ピコピコ動く） */}
                <motion.div
                  className="w-full h-full"
                  animate={{ y: [0, -5, 0] }}
                  transition={{ duration: 1.5, repeat: Infinity, ease: "steps(4)" }}
                >
                  <img 
                    src={ASSETS.shrine} 
                    className="w-full h-full object-cover pixelated opacity-90 group-hover:opacity-100 transition-opacity duration-300" 
                    alt="神社リンク"
                  />
                </motion.div>

                {/* 雪 */}
                <SnowEffect />

                {/* 中央の「Touch to Pray」ボタン風装飾 */}
                <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-center">
                  <div className="bg-black/40 backdrop-blur-sm border border-white/40 px-8 py-4 rounded-full group-hover:bg-white/10 group-hover:border-yellow-400 transition-all duration-300">
                    <p className="text-white font-serif text-xl md:text-3xl tracking-[0.2em] font-bold shadow-black drop-shadow-lg">
                      Touch to Pray
                    </p>
                    <p className="text-white/80 text-xs md:text-sm mt-2 tracking-widest font-mono">
                      〜 参拝してゲームを遊ぶ 〜
                    </p>
                  </div>
                </div>
              </a>
            </section>


            {/* ========================================
              SECTION 3: FOOTER
              ========================================
              左に文字、右にキャラ、左端に再度英語
            */}
            <section className="relative min-h-[70vh] bg-white py-20 px-6 overflow-hidden">
              
              {/* 左端の英語（グレーで薄く） */}
              <div className="absolute top-0 left-[2%] h-full pointer-events-none opacity-20 hidden md:block">
                <h2 className="vertical-rl text-[10vh] leading-none font-serif text-gray-400"
                    style={{ fontFamily: "'Cinzel', serif" }}>
                  Happy New Yare2026
                </h2>
              </div>

              <div className="max-w-6xl mx-auto w-full relative z-10 flex flex-col md:flex-row items-end justify-between gap-12 pl-0 md:pl-32">
                
                {/* テキストエリア */}
                <div className="flex-1 space-y-8">
                  <h2 className="text-2xl md:text-3xl font-bold text-[#B80028]">まだ全然やることが終わってない！！</h2>
                  
                  <div className="text-gray-800 text-sm md:text-base leading-loose space-y-4 font-medium text-justify">
                    <p>旧年中は大変お世話になりました。皆様のおかげで無事に2026年を迎えることができました。</p>
                    <p>実のところ、2025年はやるべきことを完遂できず、悔いの残る形となってしまいました……。決して誇れることではありませんが、気持ちを切り替えて、まずは目の前の課題を一つひとつ片付けていく所存です。</p>
                    <p>さて、2026年は午（うま）年ですね。その影響もあってか、最近は競馬などの「馬」コンテンツにすっかり魅了されています。特にドラマ『ザ・ロイヤルファミリー』が気になって仕方がないのですが、未消化のタスクが山積みでまだ見られていません。</p>
                    <p className="text-[#B80028] font-bold">早くやるべきことを終わらせて、心置きなくドラマを楽しみたいと思います。</p>
                    <p className="text-xs text-gray-500 mt-4">相変わらずバタバタとした私ですが、本年も変わらぬお付き合いのほど、よろしくお願いいたします。</p>
                  </div>
                </div>

                {/* キャラクター */}
                <div className="relative flex-shrink-0 mx-auto md:mx-0">
                   <motion.div 
                     animate={{ y: [0, -10, 0] }}
                     transition={{ duration: 3, repeat: Infinity, ease: "easeInOut" }}
                     className="absolute -top-12 -left-8 bg-white border-2 border-gray-300 px-4 py-2 rounded-full shadow-lg z-10"
                   >
                     <p className="text-xs text-gray-600 font-bold font-mono">ま……終わらねぇ</p>
                   </motion.div>
                   <img src={ASSETS.girl} className="w-56 md:w-80" alt="キャラクター" />
                </div>
              </div>

              <footer className="absolute bottom-4 left-0 w-full text-center text-[10px] text-gray-400 font-mono">
                © 2026 HINOEUMA Project - Design Yano Taichi
              </footer>
            </section>

          </div>
        </>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
